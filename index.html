<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Domemory v82 - Neon Highway (Fix UI)</title>
    <style>
        /* ==================== ネオン街 テーマ定義 ==================== */
        :root { 
            --p: #ff0055;            /* ネオンピンク */
            --p-dark: #cc0044;       
            --bg: #422322;           /* 深夜のメイン背景 */
            --acc: #00ffaa;          /* ネオングリーン */
            --danger: #00f0ff;       /* ネオンシアン */
            --new: #ffcc00;          /* ネオンイエロー */
            --text: #3a5fcd;         
            --text-dark: #7fbfff;    
            --gold: #7000ff;         /* ネオンパープル */
            --shuffle: #99ff00;      
            --card-bg: rgba(20, 22, 34, 0.92); 
            --input-bg: #05060b;
        }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; /* ← box-shadowからbox-sizingに修正してズレを解決 */
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--text); 
            padding-bottom: calc(85px + env(safe-area-inset-bottom, 16px)); 
            overflow-x: hidden; 
            position: relative; 
            min-height: 100dvh; 
        }

        button, .card, .sub-tab, .tab, .choice-btn {
            touch-action: manipulation;
        }

        .city-bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100dvh;
            z-index: -1; pointer-events: none;
            overflow: hidden;
            background-color: var(--bg);
        }
        .city-base-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('http://googleusercontent.com/image_generation_content/16') center center / cover no-repeat;
            z-index: 1;
            opacity: 0.15; 
            filter: grayscale(30%) brightness(50%);
        }
        #highway-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            mix-blend-mode: screen;
            opacity: 0.4;
        }

        .page { 
            padding: 12px; 
            width: 100%;
            max-width: 500px; 
            margin: 0 auto; 
            display: none; 
            position: relative; 
            z-index: 10; 
            overflow-x: hidden;
        }
        .active { display: block; }
        
        #page-add, #page-quiz {
            min-height: calc(100dvh - 90px);
            display: none;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            width: 100%;
            padding: 10px;
        }
        #page-add.active, #page-quiz.active {
            display: flex;
        }

        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px; 
            border-radius: 14px; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); 
            margin-bottom: 12px; 
            border: 1px solid rgba(255, 0, 85, 0.4); 
            position: relative; 
            transition: all 0.3s ease; 
            width: 100%; 
            max-width: 100%;
            z-index: 10; 
            color: var(--text); 
        }

        .menu { 
            background: rgba(13, 14, 21, 0.96); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            color: #fff; 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            display: flex; 
            justify-content: space-around; 
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 12px)) 0; 
            z-index: 2000; 
            border-top: 2px solid rgba(255, 0, 85, 0.6); 
            box-shadow: 0 -4px 25px rgba(255, 0, 85, 0.3); 
        }
        .menu button { 
            height: 44px;
            background: none; 
            color: #7e84a3; 
            font-size: 11px; 
            font-weight: bold;
            border: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 2px; 
            flex: 1; 
            cursor: pointer; 
        }
        .menu button span-icon { font-size: 18px; }
        .menu button.active-nav { 
            color: var(--p); 
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.8); 
        }

        .status-miss { background-color: rgba(0, 240, 255, 0.08) !important; border-left: 5px solid var(--danger); } 
        .status-new { background-color: rgba(255, 204, 0, 0.06) !important; border-left: 5px solid var(--new); } 
        .status-wait { background-color: rgba(255, 0, 85, 0.08) !important; border-left: 5px solid var(--p); } 
        .status-veteran { background-color: rgba(112, 0, 255, 0.08) !important; border-left: 5px solid var(--gold); border: 1px solid var(--gold); } 

        input, select, textarea { 
            width: 100%; 
            max-width: 100%;
            padding: 11px 14px; 
            margin: 6px 0; 
            font-size: 15px !important; 
            border: 2px solid rgba(255, 0, 85, 0.4); 
            border-radius: 9px; 
            outline: none; 
            scroll-margin-top: 80px;
            background: var(--input-bg); 
            color: #ffffff;
            font-family: inherit; 
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--p);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6); 
        }
        textarea { resize: vertical; min-height: 100px; }

        select[multiple] {
            min-height: 95px;
            padding: 6px;
        }

        .search-bar-container { margin-bottom: 10px; width: 100%; }
        .search-input { background: var(--card-bg); color: #fff; border: 2px solid rgba(255, 0, 85, 0.5); font-weight: 500; }

        .main-btn { 
            width: 100%; 
            max-width: 100%;
            padding: 12px; 
            border: none; 
            border-radius: 9px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .main-btn:active { transform: scale(0.98); }
        
        .btn-p { background: linear-gradient(135deg, var(--p), var(--p-dark)); color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .btn-sub { background: rgba(255, 255, 255, 0.1); color: #ffffff; padding: 5px 8px; font-size: 11px; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; } 
        .btn-edit { background: linear-gradient(135deg, var(--gold), #5500cc); color: #ffffff; padding: 5px 8px; font-size: 11px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; } 
        .btn-d { background: linear-gradient(135deg, var(--danger), #00b0cc); color: #000000; padding: 5px 8px; border: none; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; } 
        
        .q-text { font-size: 28px; font-weight: bold; margin: 20px 0; text-align: center; word-break: break-all; color: #ffffff; text-shadow: 0 0 8px rgba(255,255,255,0.5); } 
        .countdown { font-size: 70px; color: var(--p); text-align: center; font-weight: bold; margin: 15px 0; text-shadow: 0 0 20px rgba(255, 0, 85, 0.8); } 
        
        #quiz-ui-container { position: relative; width: 100%; }

        .choices-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; width: 100%; }
        .choice-btn { background: var(--input-bg); border: 2px solid rgba(255, 0, 85, 0.4); padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; color: #ffffff; text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5); } 
        .choice-btn:active { transform: scale(0.97); background: var(--p); color: #ffffff; }
        .choices-disabled .choice-btn { pointer-events: none; opacity: 0.4; } 

        .wait-timer { font-size: 14px; color: var(--new); text-align: center; margin-bottom: 8px; font-weight: bold; text-shadow: 0 0 5px rgba(255,204,0,0.4); } 

        /* フォルダ切り替えバー（タブ）の設定 */
        .tabs { 
            display: flex; 
            overflow-x: auto; 
            overflow-y: hidden; 
            gap: 6px; 
            padding: 8px 4px; 
            width: 100%; 
            -webkit-overflow-scrolling: touch;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 0, 85, 0.2);
        }
        /* スクロールバーを見やすく微表示に調整 */
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-thumb { background: rgba(255, 0, 85, 0.3); border-radius: 2px; }
        
        .tab { display: inline-block; white-space: nowrap; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,0,85,0.3); padding: 6px 14px; border-radius: 16px; font-size: 13px; color: #ffffff; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
        .tab-active { background: var(--p); color: #ffffff; font-weight: bold; border-color: var(--p); box-shadow: 0 0 8px rgba(255,0,85,0.6); } 

        .sub-tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 3px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,0,85,0.3); width: 100%; } 
        .sub-tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; color: #a0a5c0; border-radius: 6px; cursor: pointer; } 
        .sub-tab-active { background: var(--p); color: #ffffff; } 

        .li-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; padding: 12px; width: 100%; }
        .li-checkbox-area { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .li-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: var(--p); margin: 0; }
        .li-info { flex: 1; min-width: 0; word-break: break-all; padding-left: 4px; } 
        .action-btns { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; justify-content: center; width: 66px; } 
        .action-btns button { text-align: center; width: 100%; padding: 5px 2px; font-size: 10px; }

        .badge { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 3px; margin-top: 4px; font-weight: bold; background: rgba(255,255,255,0.15); color: #ffffff; } 
        .due-timer { font-size: 10px; color: var(--danger); margin-top: 4px; margin-left: 4px; display: inline-block; } 

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100dvh; background:rgba(5, 6, 11, 0.85); z-index:3000; align-items:center; justify-content:center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 20px; } 
        .hidden { display: none !important; }
        .abort-container { margin-top: 15px; text-align: center; border-top: 1px dashed rgba(255,0,85,0.3); padding-top: 10px; width: 100%; } 
        
        .pl-actions-container { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px; width: 100%; margin-top:4px; }
        .bulk-action-bar { background: var(--card-bg); border: 2px solid var(--p); border-radius: 12px; padding: 12px; margin-bottom: 12px; width: 100%; } 

        #toast-container { position: fixed; top: 20px; left: 0; right: 0; margin: 0 auto; z-index: 9999; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { background: var(--card-bg); color: #ffffff; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,85,0.4); display: flex; align-items: center; justify-content: center; animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, toastOut 0.3s ease 2.7s forwards; border-left: 5px solid var(--p); pointer-events: auto; width: 100%; text-align: center; border-top: 1px solid rgba(255,0,85,0.3); } 
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

        #bg-effect-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 5; opacity: 0; transition: all 0.2s ease; }
        .bg-correct-active { opacity: 1 !important; background: rgba(255, 0, 85, 0.15); } 
        .bg-miss-active { opacity: 1 !important; background: rgba(0, 240, 255, 0.15) !important; } 

        #quiz-effect-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; display: flex; justify-content: center; align-items: center; }
        .quiz-effect-box { background: var(--card-bg); padding: 14px 20px; border-radius: 10px; box-shadow: 0 0 25px rgba(255,0,85,0.5); border: 2px solid var(--p); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .quiz-effect-txt { font-size: 34px; font-weight: 900; letter-spacing: 1px; text-align: center; width: 100%; }
        
        .txt-correct { background: linear-gradient(90deg, #ff0055, #ff5500, #00ffaa, #ff5500, #ff0055); background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: correctPop 800ms ease-out forwards; } 
        @keyframes correctPop { 0% { transform: scale(0.6); opacity: 0; } 25% { transform: scale(1.05); opacity: 1; } 85% { transform: scale(1.0); opacity: 1; } 100% { transform: scale(0.95); opacity: 0; } }
        
        .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; animation: particleBlow 0.5s forwards; left: 50%; top: 50%; }
        @keyframes particleBlow { 0% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(calc(-50% + var(--mx)), calc(-50% + var(--my))) scale(0); opacity: 0; } }

        .txt-miss { background: linear-gradient(135deg, #00f0ff, #00ffaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; animation: missShake 1950ms ease-in-out forwards; width: 100%; text-align: center; } 
        .miss-ans-subtext { display: block; font-size: 15px; color: #ffffff; font-weight: bold; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px; margin-top: 6px; border: 1px solid rgba(0,240,255,0.4); width: 100%; text-align: center; word-break: break-all; } 
        @keyframes missShake { 0% { transform: translateX(0) scale(0.9); opacity: 0; } 4%, 12%, 20%, 28% { transform: translateX(-4px); opacity: 1; } 8%, 16%, 24%, 32% { transform: translateX(4px); } 36% { transform: translateX(0) translateY(0); opacity: 1; } 88% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(15px); opacity: 0; } }

        .txt-complete { background: linear-gradient(90deg, var(--acc), var(--shuffle), var(--p), var(--new), var(--danger)); background-size: 400% 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 34px; font-weight: 900; text-align: center; margin-bottom: 12px; }
        .confirm-btn-grid { display: flex; gap: 8px; margin-top: 15px; width: 100%; }
        .confirm-btn { flex: 1; padding: 10px; border: none; border-radius: 7px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; }
    </style>
</head>
<body>

    <div class="city-bg-container">
        <div class="city-base-image"></div>
        <canvas id="highway-canvas"></canvas>
    </div>

    <div id="toast-container"></div>
    <div id="bg-effect-overlay"></div>

    <div id="confirm-modal" class="modal-overlay" style="z-index: 5000;">
        <div class="card" style="width:85%; max-width:330px; text-align: center;">
            <h3 style="margin-top:0;" id="confirm-title">確認</h3> 
            <p id="confirm-msg" style="font-size:13px; color:#c0c5e0; line-height:1.5; margin-bottom:15px;"></p> 
            <div class="confirm-btn-grid">
                <button class="confirm-btn" style="background:rgba(255,255,255,0.15);" id="confirm-cancel-btn">いいえ</button> 
                <button class="confirm-btn" style="background:linear-gradient(135deg, var(--danger), #00b0cc); color:#000;" id="confirm-ok-btn">はい</button> 
            </div>
        </div>
    </div>

    <div id="complete-modal" class="modal-overlay">
        <div class="card" style="width:85%; max-width:350px; text-align: center; padding: 25px 15px;">
            <div class="txt-complete">🎉 COMPLETE !!</div>
            <p style="font-size:15px; font-weight:bold; margin: 0 0 15px 0;">すべてのクイズが終了しました！</p> 
            <button class="main-btn btn-p" onclick="closeModal('complete-modal')">戻る</button>
        </div>
    </div>

    <div id="list-modal" class="modal-overlay">
        <div class="card" style="width:85%; max-width:330px;">
            <h3 style="margin-top:0" id="modal-title">フォルダを適用</h3>
            <select id="modal-pl-select" multiple style="font-size: 13px;"></select>
            <p style="font-size:11px; color:#a0a5c0; margin: 4px 0;">※複数選択可 (スマホはタップ、PCはCtrlやCmdキーを押しながら)</p>
            <div style="display:flex; gap:8px; margin-top:10px;">
                <button class="main-btn" style="background:rgba(255,255,255,0.15); flex:1;" onclick="closeModal('list-modal')">戻る</button> 
                <button class="main-btn btn-p" style="flex:1;" id="modal-execute-btn">適用する</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="card" style="width:85%; max-width:330px;">
            <h3 style="margin-top:0">単語を編集</h3>
            <label style="font-size:11px; color:#a0a5c0;">English</label> <input id="edit-en-in" type="text" autocomplete="off">
            <label style="font-size:11px; color:#a0a5c0;">日本語</label> <input id="edit-ja-in" type="text" autocomplete="off">
            <label style="font-size:11px; color:#a0a5c0; font-weight:bold; margin-top:4px; display:block;">所属フォルダ（複数選択可）</label>
            <select id="edit-playlists-select" multiple style="font-size:13px; margin-top:4px;"></select>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="main-btn" style="background:rgba(255,255,255,0.15); flex:1;" onclick="closeModal('edit-modal')">戻る</button> 
                <button class="main-btn btn-edit" style="flex:1;" onclick="executeEditWord()">更新</button>
            </div>
        </div>
    </div>

    <div id="page-add" class="page">
        <div class="card">
            <h2 style="margin:0 0 12px 0; color:var(--p); text-shadow:0 0 10px rgba(255,0,85,0.4)">単語を登録</h2> 
            <label style="font-size:11px; color:#a0a5c0; font-weight:bold;">追加先フォルダ（複数選択可）</label> 
            <select id="add-to-playlist" multiple style="margin-top:4px; margin-bottom:12px; font-size:13px;"></select>

            <div class="sub-tabs">
                <div id="sub-tab-single" class="sub-tab sub-tab-active" onclick="switchAddMode('single')">1件ずつ登録</div>
                <div id="sub-tab-bulk" class="sub-tab" onclick="switchAddMode('bulk')">AI一括登録</div>
            </div>

            <div id="add-single-container" style="width: 100%;">
                <input id="en-in" type="text" placeholder="English" autocomplete="off" onkeydown="if(event.key==='Enter' && this.value.trim() !== '') { event.preventDefault(); setTimeout(() => { document.getElementById('ja-in').focus(); }, 10); }">
                <input id="ja-in" type="text" placeholder="日本語" autocomplete="off" onkeydown="if(event.key==='Enter') saveWord()">
                <button class="main-btn btn-p" onclick="saveWord()">保存する</button>
            </div>

            <div id="add-bulk-container" class="hidden" style="width: 100%;">
                <textarea id="bulk-import-area" placeholder="rational, 合理的な&#10;irrational, 非合理的な"></textarea>
                <button class="main-btn btn-p" style="background:linear-gradient(135deg, #ff5500, #ff0055); margin-bottom: 8px;" onclick="saveBulkWords()">一括保存する</button> 
            </div>
        </div>
    </div>

    <div id="page-quiz" class="page">
        <div class="card" id="quiz-main-card">
            <div id="count-area" class="countdown hidden"></div>
            <div id="q-display" class="q-text">クイズ道場</div>
            
            <div id="quiz-ui-container">
                <div id="quiz-effect-layer"></div>

                <div id="quiz-ui" class="hidden">
                    <input id="ans-in" type="text" placeholder="答えを入力" style="text-align:center;" autocomplete="off" onkeydown="if(event.key==='Enter') handleCheck()">
                    <button class="main-btn btn-p" onclick="handleCheck()">決定</button>
                </div>
                <div id="choice-ui" class="hidden">
                    <div id="wait-area">
                        <div id="wait-timer" class="wait-timer">選択肢表示まであと 2 秒</div>
                        <button class="main-btn btn-sub" style="width:100%; margin-bottom:8px;" onclick="skipWait()">今すぐ表示</button>
                    </div>
                    <div id="choices-grid" class="choices-grid hidden"></div>
                </div>
            </div>

            <div id="abort-ui" class="abort-container hidden">
                <button class="btn-sub" style="background:none; border:none; text-decoration:underline; color:#a0a5c0;" onclick="triggerAbortQuiz()">クイズを中止する</button>
            </div>

            <div id="quiz-setup" style="width: 100%;">
                <p style="text-align:center; font-weight: bold;">対象: <select id="quiz-from-playlist" style="width:auto; display:inline-block; padding:6px 10px; margin:0; background:var(--input-bg); color:#ffffff;"></select></p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom:8px;">
                    <button class="main-btn" style="background: linear-gradient(135deg, #cb8b4a, #d6a470); color:#fff;" onclick="startQuizWithCountdown('new')">新規(4択)</button>
                    <button class="main-btn" style="background: linear-gradient(135deg, #bb738b, #ca94a6); color:#fff;" onclick="startQuizWithCountdown('srs')">復習(6択)</button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom:8px;">
                    <button class="main-btn" style="background: linear-gradient(135deg, #00cccc, #008080); color:#000;" onclick="startQuizWithCountdown('today')">その日モード</button>
                    <button class="main-btn" style="background: linear-gradient(135deg, #bb738b, #704060); color:#fff;" onclick="startQuizWithCountdown('yesterday')">昨日の復習</button>
                </div>
                <button class="main-btn" style="background: linear-gradient(135deg, var(--danger), #00b0cc); color:#000; margin-bottom: 8px;" onclick="startQuizWithCountdown('miss')">苦手特訓(4択)</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="main-btn" style="background: linear-gradient(135deg, #919b73, #aab491); color:#fff;" onclick="startQuizWithCountdown('all_choice')">既習(選択)</button>
                    <button class="main-btn" style="background: linear-gradient(135deg, #d2691e, #cd853f); color:#fff;" onclick="startQuizWithCountdown('all_reverse')">既習(あべこべ)</button>

    <div id="page-list" class="page active">
        <div class="card" style="margin-bottom: 12px; padding: 10px 14px;">
            <div style="font-size:11px; font-weight:bold; margin-bottom:4px; color:#a0a5c0;">📁 新規フォルダ作成</div>
            <div style="display:flex; gap:6px;">
                <input id="new-playlist-name" type="text" placeholder="例: Eiken Pre-1" autocomplete="off" style="margin:0; padding:6px 10px;">

            </div>

        <div class="search-bar-container">
            <input type="text" id="word-search-input" class="search-input" placeholder="🔍 単語・意味を検索..." autocomplete="off" oninput="renderWordList()">
        </div>

        <div class="tabs" id="list-tabs-container"></div>

        <div class="pl-actions-container">

    <div id="page-settings" class="page">
        <div class="card" style="border: 2px solid var(--gold); box-shadow: 0 0 15px rgba(112,0,255,0.4);">

            <label style="font-size:11px; font-weight:bold; color:#a0a5c0;">GitHub ユーザー名</label>
            <input id="gh-user" type="text" placeholder="example-user" autocomplete="off" style="padding:8px; margin:2px 0 8px 0;">
            
            <label style="font-size:11px; font-weight:bold; color:#a0a5c0;">リポジトリ名</label>
            <input id="gh-repo" type="text" placeholder="my-domemory-db" autocomplete="off" style="padding:8px; margin:2px 0 8px 0;">
            
            <label style="font-size:11px; font-weight:bold; color:#a0a5c0;">パーソナルアクセストークン (ghp_...)</label>
            <input id="gh-token" type="password" placeholder="ghp_xxxxxxxx" autocomplete="off" style="padding:8px; margin:2px 0 8px 0;">

            <label style="font-size:11px; color:var(--p); font-weight:bold;">あなたのなまえ（データ識別キー）</label>
            <input id="gh-name" type="text" placeholder="me" autocomplete="off" style="padding:8px; margin:2px 0 10px 0; border-color:var(--p);">
            
            <button class="main-btn btn-edit" style="width:100%; margin-bottom:8px;" onclick="saveGitHubSettings()">設定を保存</button>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:4px;">
                <button class="main-btn" style="background:linear-gradient(135deg, #00ffaa, #009966); color:#000000; padding:10px 4px; font-size:13px;" onclick="syncToGitHubCloud()">クラウドへ保存</button>
                <button class="main-btn" style="background:linear-gradient(135deg, #00f0ff, #008099); color:#000000; padding:10px 4px; font-size:13px;" onclick="loadFromGitHubCloud()">クラウドから読込</button>

    <nav class="menu">
        <button id="nav-add" onclick="showPage('add')"><span-icon>📝</span-icon><span>登録</span></button>
        <button id="nav-quiz" onclick="showPage('quiz')"><span-icon>⚔️</span-icon><span>クイズ</span></button>
        <button id="nav-list" class="active-nav" onclick="showPage('list')"><span-icon>🗂️</span-icon><span>一覧</span></button>
        <button id="nav-settings" onclick="showPage('settings')"><span-icon>⚙️</span-icon><span>設定</span></button>
    </nav>

    <script>
        const STORAGE_KEY = "domemory_v78_unified_data";

        // メインデータ構造
        let data = {
            words: [],
            playlists: ["全て", "最近間違えたリスト", "一度でも間違えた単語"]
        };
        let currentPlaylist = "全て";
        let selectedWordIds = new Set();

        // クイズ状態管理
        let quizWords = [];
        let currentQuizIndex = 0;
        let quizMode = 'new'; 
        let countdownInterval = null;
        let quizTimerTimeout = null;
        let isProcessingResult = false; 

        let gitHubConfig = { username: "", repo: "", token: "", name: "me" };

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function ensureCustomPlaylists(w) {
            if (!w.hasOwnProperty('inRecentMissList')) {
                w.inRecentMissList = (w.missCount > 0); 
            }
        }

        function sanitizeAndUnwrapData(obj) {
            if (!obj) return null;
            if (obj.data && Array.isArray(obj.data.words)) return sanitizeAndUnwrapData(obj.data);
            if (obj.words && Array.isArray(obj.words)) return obj;
            return null;
        }

        function loadData() {
            const local = localStorage.getItem(STORAGE_KEY);
            if (local) {
                try {
                    let parsed = JSON.parse(local);
                    let cleanData = sanitizeAndUnwrapData(parsed);
                    if (cleanData) {
                        data.words = cleanData.words;
                        data.playlists = cleanData.playlists || data.playlists;
                    }
                } catch(e) { console.error(e); }
            }
            
            if (!data.playlists.includes("全て")) data.playlists.unshift("全て");
            if (!data.playlists.includes("最近間違えたリスト")) {
                data.playlists.splice(1, 0, "最近間違えたリスト");
            }
            if (!data.playlists.includes("一度でも間違えた単語")) {
                const idx = data.playlists.indexOf("最近間違えたリスト");
                data.playlists.splice(idx + 1, 0, "一度でも間違えた単語");
            }

            data.playlists = data.playlists.filter(p => p !== "デフォルト");
            
            // 複数所属対応へのデータ互換コンバーター
            data.words.forEach(w => {
                if (!w.playlists) {
                    if (w.playlist && w.playlist !== "デフォルト") {
                        w.playlists = [w.playlist];
                    } else {
                        w.playlists = ["全て"];
                    }
                }
                if (!Array.isArray(w.playlists) || w.playlists.length === 0) {
                    w.playlists = ["全て"];
                }
                if (!w.playlists.includes("全て")) {
                    w.playlists.push("全て");
                }
                delete w.playlist; 
                ensureCustomPlaylists(w);
            });

            const ghLocal = localStorage.getItem("domemory_github_config");
            if (ghLocal) {
                try {
                    gitHubConfig = JSON.parse(ghLocal);
                    document.getElementById('gh-user').value = gitHubConfig.username || "";
                    document.getElementById('gh-repo').value = gitHubConfig.repo || "";
                    document.getElementById('gh-token').value = gitHubConfig.token || "";
                    document.getElementById('gh-name').value = gitHubConfig.name || "me";
                } catch(e) {}
            }
        }

        function saveGitHubSettings() {
            gitHubConfig.username = document.getElementById('gh-user').value.trim();
            gitHubConfig.repo = document.getElementById('gh-repo').value.trim();
            gitHubConfig.token = document.getElementById('gh-token').value.trim();
            let inputName = document.getElementById('gh-name').value.trim() || "me";
            gitHubConfig.name = inputName;
            localStorage.setItem("domemory_github_config", JSON.stringify(gitHubConfig));
            showToast(`設定（${inputName}）をローカル保存しました`);
        }

        async function uploadToGitHubFile(filename) {
            const { username, repo, token } = gitHubConfig;
            if (!username || !repo || !token) return;
            const url = `https://api.github.com/repos/${username}/${repo}/contents/${filename}`;
            const jsonStr = JSON.stringify(data, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonStr)));
            let sha = null;
            try {
                const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if (res.ok) { const fileData = await res.json(); sha = fileData.sha; }
            } catch (e) {}
            const bodyObj = { message: `Update ${filename}`, content: contentBase64 };
            if (sha) bodyObj.sha = sha;
            await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify(bodyObj)
            });
        }

        async function syncToGitHubCloud() {
            const filename = `domemory_data_${gitHubConfig.name || "me"}.json`;
            showToast("クラウドへ同期送信中...");
            try {
                await uploadToGitHubFile(filename);
                showToast("☁️ クラウド同期が完了しました");
            } catch (e) { showToast("同期エラーが発生しました", true); }
        }

        async function loadFromGitHubCloud() {
            const { username, repo, token, name } = gitHubConfig;
            const filename = `domemory_data_${name || "me"}.json`;
            if (!username || !repo || !token) { showToast("設定が未完全です", true); return; }
            showToast("クラウドからデータを読込中...");
            try {
                let response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${filename}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (response.ok) {
                    const fileData = await response.json();
                    const rawText = decodeURIComponent(escape(atob(fileData.content)));
                    const downloadedData = JSON.parse(rawText);
                    
                    let cleanData = sanitizeAndUnwrapData(downloadedData);
                    
                    if (cleanData && Array.isArray(cleanData.words)) {
                        data.words = cleanData.words;
                        data.playlists = cleanData.playlists || ["全て", "最近間違えたリスト", "一度でも間違えた単語"];
                        saveData(); 
                        loadData(); 
                        updateUI();
                        showToast(`☁️ クラウドから ${data.words.length} 件の単語を正常読込！`);
                    } else {
                        showToast("サーバーデータの構造が正しくありません", true);
                    }
                } else { showToast("データが見つかりません", true); }
            } catch (e) { showToast("読込失敗しました", true); }
        }

        window.addEventListener('pagehide', function() {
            if (gitHubConfig.username && gitHubConfig.repo && gitHubConfig.token) {
                uploadToGitHubFile(`domemory_data_${gitHubConfig.name || "me"}.json`).catch(()=>{});
            }
        });

        function showToast(message, isError = false) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast`;
            if(isError) toast.style.borderLeftColor = "var(--p)";
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function showConfirm(title, message, onConfirm) {
            document.getElementById("confirm-title").innerText = title;
            document.getElementById("confirm-msg").innerText = message;
            const modal = document.getElementById("confirm-modal");
            modal.style.display = "flex";
            document.getElementById("confirm-ok-btn").onclick = () => { onConfirm(); modal.style.display = "none"; };
            document.getElementById("confirm-cancel-btn").onclick = () => { modal.style.display = "none"; };
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function showPage(pageId) {
            if(isProcessingResult) return; 
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active-nav'));
            
            const targetPage = document.getElementById(`page-${pageId}`);
            if(targetPage) targetPage.classList.add('active');
            const targetNav = document.getElementById(`nav-${pageId}`);
            if(targetNav) targetNav.classList.add('active-nav');
            
            if(pageId === 'quiz') forceAbortQuizRaw();
            updateUI();
        }

        function switchAddMode(mode) {
            document.getElementById('sub-tab-single').classList.toggle('sub-tab-active', mode === 'single');
            document.getElementById('sub-tab-bulk').classList.toggle('sub-tab-active', mode === 'bulk');
            document.getElementById('add-single-container').classList.toggle('hidden', mode !== 'single');
            document.getElementById('add-bulk-container').classList.toggle('hidden', mode !== 'bulk');
        }

        function getSelectedOptions(selectElement) {
            return Array.from(selectElement.selectedOptions).map(option => option.value);
        }

        function updatePlaylistDropdowns() {
            const addSelect = document.getElementById("add-to-playlist");
            const quizSelect = document.getElementById("quiz-from-playlist");
            const editSelect = document.getElementById("edit-playlists-select");
            if(!addSelect || !quizSelect || !editSelect) return;

            const prevQuizVal = quizSelect.value;
            addSelect.innerHTML = ""; quizSelect.innerHTML = ""; editSelect.innerHTML = "";

            data.playlists.forEach(pl => {
                if (pl !== "一度でも間違えた単語" && pl !== "最近間違えたリスト") {
                    const opt1 = document.createElement("option"); opt1.value = pl; opt1.innerText = pl; addSelect.appendChild(opt1);
                    const opt3 = document.createElement("option"); opt3.value = pl; opt3.innerText = pl; editSelect.appendChild(opt3);
                }
                const opt2 = document.createElement("option"); opt2.value = pl; opt2.innerText = pl; quizSelect.appendChild(opt2);
            });

            if(currentPlaylist !== "全て" && currentPlaylist !== "一度でも間違えた単語" && currentPlaylist !== "最近間違えたリスト") {
                addSelect.value = currentPlaylist;
            } else {
                addSelect.value = "全て";
            }
            quizSelect.value = prevQuizVal && [...quizSelect.options].some(o => o.value === prevQuizVal) ? prevQuizVal : "全て";
        }

        function createPlaylist() {
            const inputEl = document.getElementById("new-playlist-name");
            const name = inputEl.value.trim();
            if(!name) return;
            if(data.playlists.includes(name)) { showToast("既に存在します", true); return; }
            
            data.playlists.push(name);
            inputEl.value = ""; 
            saveData(); updateUI();
            showToast(`フォルダ「${name}」を作成！`);
        }

        function saveWord() {
            const en = document.getElementById("en-in").value.trim();
            const ja = document.getElementById("ja-in").value.trim();
            let selectedPls = getSelectedOptions(document.getElementById("add-to-playlist"));
            if(selectedPls.length === 0) selectedPls = ["全て"];
            if(!selectedPls.includes("全て")) selectedPls.push("全て");

            if(!en || !ja) { showToast("両方入力してください", true); return; }

            data.words.unshift({
                id: "w-" + Date.now() + Math.random(), en, ja, playlists: selectedPls,
                status: "new", missCount: 0, lastTested: null, nextReview: null, interval: 0,
                recentMissTimestamp: null, inRecentMissList: false
            });
            saveData();
            document.getElementById("en-in").value = ""; document.getElementById("ja-in").value = "";
            document.getElementById("en-in").focus();
            showToast("単語を登録しました！");
            updateUI();
        }

function saveBulkWords() {
            const text = document.getElementById("bulk-import-area").value;
            let selectedPls = getSelectedOptions(document.getElementById("add-to-playlist"));
            if(selectedPls.length === 0) selectedPls = ["全て"];
            if(!selectedPls.includes("全て")) selectedPls.push("全て");
            if(!text.trim()) return;

            const lines = text.split('\n');
            let successCount = 0;
            lines.forEach(line => {
                if(!line.trim()) return;
                
                let parts = line.split('|'); 
                if(parts.length >= 2) {
                    const en = parts[0].trim(); 
                    const ja = parts.slice(1).join('|').trim(); 
                
                    // enが空欄（スペースのみ等含む）でなければ登録に進む
                    if(en !== "" && ja !== "") {
                        data.words.unshift({
                            id: "w-" + Date.now() + Math.random(), en, ja, playlists: [...selectedPls],
                            status: "new", missCount: 0, lastTested: null, nextReview: null, interval: 0,
                            recentMissTimestamp: null, inRecentMissList: false
                        });
                        successCount++;
                    }
                }
            }); // lines.forEach の閉じ
            
            if(successCount > 0) {
                saveData(); 
                document.getElementById("bulk-import-area").value = "";
                showToast(`${successCount}件一括登録成功`); 
                updateUI();
            }
        }

        let editingWordId = null;
        function openEditModal(id) {
            editingWordId = id;
            const w = data.words.find(item => item.id === id);
            if(!w) return;
            document.getElementById("edit-en-in").value = w.en;
            document.getElementById("edit-ja-in").value = w.ja;

            const editSelect = document.getElementById("edit-playlists-select");
            Array.from(editSelect.options).forEach(opt => {
                opt.selected = w.playlists && w.playlists.includes(opt.value);
            });

            document.getElementById("edit-modal").style.display = "flex";
        }
        function executeEditWord() {
            const en = document.getElementById("edit-en-in").value.trim();
            const ja = document.getElementById("edit-ja-in").value.trim();
            let selectedPls = getSelectedOptions(document.getElementById("edit-playlists-select"));
            if(selectedPls.length === 0) selectedPls = ["全て"];
            if(!selectedPls.includes("全て")) selectedPls.push("全て");

            if(!en || !ja) return;
            const w = data.words.find(item => item.id === editingWordId);
            if(w) { 
                w.en = en; w.ja = ja; w.playlists = selectedPls;
                saveData(); updateUI(); showToast("変更を適用しました"); 
            }
            closeModal('edit-modal');
        }

        function deleteWord(id) {
            showConfirm("削除確認", "この単語を完全に削除しますか？(すべてのフォルダから消去されます)", () => {
                data.words = data.words.filter(w => w.id !== id);
                selectedWordIds.delete(id); saveData(); updateUI(); showToast("削除しました");
            });
        }

        function triggerResetWordSRS(id) {
            showConfirm("SRSリセット", "この単語の学習進捗状態を本当に初期化しますか？", () => {
                const w = data.words.find(item => item.id === id);
                if(w) {
                    w.status = "new"; w.missCount = 0; w.lastTested = null; w.nextReview = null; w.interval = 0; w.recentMissTimestamp = null; w.inRecentMissList = false;
                    saveData(); updateUI(); showToast("進行状況をリセットしました");
                }
            });
        }

        function toggleItemSelection(id) {
            if(selectedWordIds.has(id)) selectedWordIds.delete(id);
            else selectedWordIds.add(id);
            updateBulkActionBarUI();
        }
        function toggleSelectAllItems() {
            const query = document.getElementById("word-search-input").value.toLowerCase().trim();
            const filtered = data.words.filter(w => {
                const matchTab = (currentPlaylist === "全て" || (currentPlaylist === "一度でも間違えた単語" && w.missCount > 0) || (currentPlaylist === "最近間違えたリスト" && w.inRecentMissList) || (w.playlists && w.playlists.includes(currentPlaylist)));
                const matchQuery = !query || w.en.toLowerCase().includes(query) || w.ja.toLowerCase().includes(query);
                return matchTab && matchQuery;
            });
            const allSelected = filtered.every(w => selectedWordIds.has(w.id));
            filtered.forEach(w => {
                if(allSelected) selectedWordIds.delete(w.id);
                else selectedWordIds.add(w.id);
            });
            updateBulkActionBarUI(); renderWordList();
        }
        function toggleBulkActionBar() { document.getElementById("bulk-action-bar").classList.toggle("hidden"); }
        function updateBulkActionBarUI() { document.getElementById("selected-count").innerText = selectedWordIds.size; }
        
        function openBulkPlaylistModal(isAddMode) {
            if(selectedWordIds.size === 0) return;
            document.getElementById("modal-title").innerText = isAddMode ? "選択した単語にフォルダを追加" : "選択した単語からフォルダを除外";
            
            const select = document.getElementById("modal-pl-select"); select.innerHTML = "";
            data.playlists.forEach(pl => {
                if(pl !== "一度でも間違えた単語" && pl !== "最近間違えたリスト" && pl !== "全て") {
                    const opt = document.createElement("option"); opt.value = pl; opt.innerText = pl; select.appendChild(opt);
                }
            });

            document.getElementById("modal-execute-btn").onclick = () => {
                const targetPls = getSelectedOptions(select);
                if(targetPls.length === 0) { showToast("フォルダを選択してください", true); return; }
                
                data.words.forEach(w => {
                    if(selectedWordIds.has(w.id)) {
                        if(!w.playlists) w.playlists = ["全て"];
                        targetPls.forEach(pl => {
                            if(isAddMode) {
                                if(!w.playlists.includes(pl)) w.playlists.push(pl);
                            } else {
                                w.playlists = w.playlists.filter(p => p !== pl);
                            }
                        });
                        if(w.playlists.length === 0 || (w.playlists.length === 1 && w.playlists[0] === "全て")) {
                            w.playlists = ["全て"];
                        }
                    }
                });
                saveData(); selectedWordIds.clear(); closeModal('list-modal'); updateUI(); 
                showToast(isAddMode ? "フォルダ一括追加完了" : "フォルダ一括除外完了");
            };
            document.getElementById("list-modal").style.display = "flex";
        }

        function executeBulkDelete() {
            if(selectedWordIds.size === 0) return;
            showConfirm("一括削除確認", `${selectedWordIds.size}件の単語データを完全に削除しますか？`, () => {
                data.words = data.words.filter(w => !selectedWordIds.has(w.id));
                selectedWordIds.clear(); saveData(); updateUI(); showToast("削除が完了しました");
            });
        }
        function executeBulkResetSRS() {
            if(selectedWordIds.size === 0) return;
            showConfirm("一括リセット確認", `${selectedWordIds.size}件 of 進捗ステータスを初期化しますか？`, () => {
                data.words.forEach(w => {
                    if(selectedWordIds.has(w.id)) {
                        w.status = "new"; w.missCount = 0; w.lastTested = null; w.nextReview = null; w.interval = 0; w.recentMissTimestamp = null; w.inRecentMissList = false;
                    }
                });
                saveData(); selectedWordIds.clear(); updateUI(); showToast("初期化しました");
            });
        }

        function renderTabs() {
            const container = document.getElementById("list-tabs-container");
            if(!container) return; container.innerHTML = "";

            data.playlists.forEach(tabName => {
                let count = 0;
                if(tabName === "全て") count = data.words.length;
                else if(tabName === "一度でも間違えた単語") count = data.words.filter(w => w.missCount > 0).length;
                else if(tabName === "最近間違えたリスト") count = data.words.filter(w => w.inRecentMissList).length;
                else count = data.words.filter(w => w.playlists && w.playlists.includes(tabName)).length;
                
                const btn = document.createElement("div");
                btn.className = `tab ${currentPlaylist === tabName ? 'tab-active' : ''}`;
                btn.innerText = `${tabName} (${count})`;
                btn.onclick = () => { currentPlaylist = tabName; selectedWordIds.clear(); updateUI(); };
                container.appendChild(btn);
            });
        }

        function renderWordList() {
            const container = document.getElementById("word-list-container");
            if(!container) return; container.innerHTML = "";

            const searchQuery = document.getElementById("word-search-input") ? document.getElementById("word-search-input").value.toLowerCase().trim() : "";
            const filtered = data.words.filter(w => {
                const matchTab = (currentPlaylist === "全て" || (currentPlaylist === "一度でも間違えた単語" && w.missCount > 0) || (currentPlaylist === "最近間違えたリスト" && w.inRecentMissList) || (w.playlists && w.playlists.includes(currentPlaylist)));
                const matchSearch = !searchQuery || w.en.toLowerCase().includes(searchQuery) || w.ja.toLowerCase().includes(searchQuery);
                return matchTab && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#a0a5c0; font-size:13px; margin-top:15px;">単語データがありません</p>`;
                return;
            }

            filtered.forEach(w => {
                const card = document.createElement("div");
                card.className = `card li-item status-${w.status || 'new'}`;

                let badgeTxt = w.status === 'wait' ? "復習待ち" : w.status === 'miss' ? "苦手" : "新規";
                let dueTxt = "";
                if(w.status === 'wait' && w.nextReview) {
                    const diff = w.nextReview - Date.now();
                    if(diff <= 0) dueTxt = "⏱️ 復習可能";
                    else {
                        const mins = Math.ceil(diff / 60000);
                        dueTxt = mins > 60 ? `⏱️ 約${Math.ceil(mins/60)}時間後` : `⏱️ あと${mins}分`;
                    }
                }
                if(w.missCount > 0) badgeTxt += ` (誤×${w.missCount})`;
                if(w.inRecentMissList) badgeTxt += " [最近の間違い]";

                const isChecked = selectedWordIds.has(w.id) ? "checked" : "";
                
                let plBadges = "";
                if(w.playlists) {
                    w.playlists.filter(p => p !== "全て").forEach(p => {
                        plBadges += `<span class="badge" style="background:rgba(255,255,255,0.05); color:#a0a5c0; margin-right:2px;">📁 ${p}</span>`;
                    });
                }

                card.innerHTML = `
                    <div class="li-checkbox-area"><input type="checkbox" class="li-checkbox" ${isChecked} onchange="toggleItemSelection('${w.id}')"></div>
                    <div class="li-info" onclick="openEditModal('${w.id}')">
                        <div style="font-weight:bold; font-size:17px; color:#ffffff;">${w.en}</div>
                        <div style="font-size:13px; color:#c0c5e0; margin-top:1px;">${w.ja}</div>
                        <div>
                            <span class="badge">${badgeTxt}</span>
                            ${dueTxt ? `<span class="due-timer">${dueTxt}</span>` : ''}
                            ${plBadges ? plBadges : `<span class="badge" style="background:rgba(255,255,255,0.05); color:#a0a5c0;">📁 未分類</span>`}
                        </div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="openEditModal('${w.id}')">編集</button>
                        <button class="btn-sub" onclick="triggerResetWordSRS('${w.id}')">リセット</button>
                        <button class="btn-d" onclick="deleteWord('${w.id}')">削除</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateBulkActionBarUI();
        }

        function updateUI() {
            updatePlaylistDropdowns();
            renderTabs();
            renderWordList();
            
            const quizTarget = document.getElementById("quiz-from-playlist") ? document.getElementById("quiz-from-playlist").value : "全て";
            let pool = data.words.filter(w => {
                if (quizTarget === "全て") return true;
                if (quizTarget === "最近間違えたリスト") return w.inRecentMissList;
                if (quizTarget === "一度でも間違えた単語") return w.missCount > 0;
                return w.playlists && w.playlists.includes(quizTarget);
            });
            
            const msgEl = document.getElementById("limit-msg");
            if(msgEl) msgEl.innerText = pool.length < 4 ? `⚠️ 単語数が不足しています (現在:${pool.length}/4件必要)` : `✅ 出題可能エリア (対象:${pool.length}件)`;
        }

        // ==================== クイズシステム ====================
        function startQuizWithCountdown(mode) {
            if(isProcessingResult) return;
            const targetPl = document.getElementById("quiz-from-playlist").value;
            
            let pool = [];
            if(mode === 'miss') {
                pool = data.words.filter(w => w.inRecentMissList);
                if(pool.length < 4) { showToast("「最近間違えたリスト」内の単語が4件未満です", true); return; }
            } else {
                pool = data.words.filter(w => {
                    if (targetPl === "全て") return true;
                    if (targetPl === "最近間違えたリスト") return w.inRecentMissList;
                    if (targetPl === "一度でも間違えた単語") return w.missCount > 0;
                    return w.playlists && w.playlists.includes(targetPl);
                });
                if(pool.length < 4) { showToast("対象エリア内の単語が4件未満です", true); return; }
            }

            quizMode = mode; 
            const now = Date.now();

            if(mode === 'new') {
                quizWords = pool.filter(w => !w.status || w.status === 'new');
            } else if(mode === 'srs') {
                quizWords = pool.filter(w => w.status === 'wait' && w.nextReview && w.nextReview <= now);
            } else if(mode === 'miss') {
                quizWords = [...pool].sort((a,b) => (b.missCount || 0) - (a.missCount || 0));
            } else if(mode === 'today') {
                quizWords = pool.filter(w => w.recentMissTimestamp && (now - w.recentMissTimestamp <= 14 * 60 * 60 * 1000));
            } else if(mode === 'yesterday') {
                quizWords = pool.filter(w => w.recentMissTimestamp && (now - w.recentMissTimestamp > 14 * 60 * 60 * 1000) && (now - w.recentMissTimestamp <= 19 * 60 * 60 * 1000));
            } else {
                quizWords = [...pool];
            }

            if(quizWords.length === 0) { showToast("条件に合致する対象の単語がゼロです"); return; }

            quizWords.sort(() => Math.random() - 0.5);
            if(quizWords.length > 20) quizWords = quizWords.slice(0, 100);

            currentQuizIndex = 0;
            document.getElementById("quiz-setup").classList.add("hidden");
            
            const countArea = document.getElementById("count-area");
            const qDisplay = document.getElementById("q-display");
            countArea.classList.remove("hidden");
            qDisplay.classList.add("hidden");

            let cnt = 3;
            countArea.innerText = cnt;
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                cnt--;
                if(cnt <= 0) {
                    clearInterval(countdownInterval);
                    countArea.classList.add("hidden");
                    qDisplay.classList.remove("hidden");
                    document.getElementById("abort-ui").classList.remove("hidden");
                    nextQuestion();
                } else {
                    countArea.innerText = cnt;
                }
            }, 800);
        }

        function triggerAbortQuiz() {
            if(isProcessingResult) return;
            showConfirm("クイズ中止", "本当に現在のクイズセッションを終了しますか？", () => {
                forceAbortQuizRaw();
            });
        }

        function forceAbortQuizRaw() {
            clearTimeout(quizTimerTimeout); clearInterval(countdownInterval);
            isProcessingResult = false;
            document.getElementById("quiz-ui").classList.add("hidden");
            document.getElementById("choice-ui").classList.add("hidden");
            document.getElementById("abort-ui").classList.add("hidden");
            document.getElementById("count-area").classList.add("hidden");
            document.getElementById("quiz-setup").classList.remove("hidden");
            document.getElementById("q-display").classList.remove("hidden");
            document.getElementById("q-display").innerText = "クイズ道場";
            document.getElementById("quiz-effect-layer").innerHTML = "";
        }

        function nextQuestion() {
            if(currentQuizIndex >= quizWords.length) {
                document.getElementById("complete-modal").style.display = "flex"; forceAbortQuizRaw(); return;
            }
            const w = quizWords[currentQuizIndex];
            isProcessingResult = false;

            if(quizMode === 'all_reverse') {
                document.getElementById("q-display").innerText = w.ja;
                document.getElementById("quiz-ui").classList.remove("hidden");
                document.getElementById("choice-ui").classList.add("hidden");
                const inEl = document.getElementById("ans-in"); inEl.value = "";
                setTimeout(() => { inEl.focus(); }, 50);
            }
            else if(quizMode === 'all') {
                document.getElementById("q-display").innerText = w.en;
                document.getElementById("quiz-ui").classList.remove("hidden");
                document.getElementById("choice-ui").classList.add("hidden");
                const inEl = document.getElementById("ans-in"); inEl.value = "";
                setTimeout(() => { inEl.focus(); }, 50);
            } 
            else {
                document.getElementById("q-display").innerText = w.en;
                document.getElementById("quiz-ui").classList.add("hidden");
                document.getElementById("choice-ui").classList.remove("hidden");
                setupChoices(w);
            }
        }

        function setupChoices(correctWord) {
            const waitArea = document.getElementById("wait-area");
            const grid = document.getElementById("choices-grid");
            const timerTxt = document.getElementById("wait-timer");

            grid.classList.add("hidden"); grid.classList.remove("choices-disabled"); waitArea.classList.remove("hidden");
            
            const choiceCount = quizMode === 'srs' ? 6 : 4;
            
            let siblings = data.words.filter(w => w.id !== correctWord.id);
            siblings.sort(() => Math.random() - 0.5);
            
            let selectedChoices = siblings.slice(0, choiceCount - 1);
            selectedChoices.push(correctWord); selectedChoices.sort(() => Math.random() - 0.5);

            grid.innerHTML = "";
            selectedChoices.forEach(c => {
                const btn = document.createElement("div"); btn.className = "choice-btn"; btn.innerText = c.ja;
                btn.onclick = () => handleChoiceCheck(c.id === correctWord.id, correctWord);
                grid.appendChild(btn);
            });

// 修正後（パターン1）
            let waitSeconds = correctWord.missCount ? 4 + (correctWord.missCount * 2) : 8; // 新規は5秒、苦手は6秒〜
            timerTxt.innerText = `選択肢表示まであと ${Math.ceil(waitSeconds)} 秒`;
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                waitSeconds--;
                if(waitSeconds <= 0) { clearInterval(countdownInterval); waitArea.classList.add("hidden"); grid.classList.remove("hidden"); }
                else timerTxt.innerText = `選択肢表示まであと ${Math.ceil(waitSeconds)} 秒`;
            }, 1000);

            clearTimeout(quizTimerTimeout);
            quizTimerTimeout = setTimeout(() => { clearInterval(countdownInterval); waitArea.classList.add("hidden"); grid.classList.remove("hidden"); }, waitSeconds * 1000);
        }

        function skipWait() {
            clearInterval(countdownInterval); clearTimeout(quizTimerTimeout);
            document.getElementById("wait-area").classList.add("hidden"); document.getElementById("choices-grid").classList.remove("hidden");
        }

        function handleCheck() {
            if(isProcessingResult) return;
            const inEl = document.getElementById("ans-in"); const userAns = inEl.value.trim();
            const w = quizWords[currentQuizIndex]; if(!userAns) return;

            let isCorrect = false;
            if(quizMode === 'all_reverse') {
                isCorrect = (userAns.toUpperCase() === w.en.toUpperCase());
            } else {
                isCorrect = (w.ja.toLowerCase().includes(userAns.toLowerCase()) || userAns.toLowerCase() === w.ja.toLowerCase());
            }
            processResult(isCorrect, w);
        }

        function handleChoiceCheck(isCorrect, w) {
            if(isProcessingResult) return;
            document.getElementById("choices-grid").classList.add("choices-disabled"); 
            processResult(isCorrect, w);
        }

        function processResult(isCorrect, w) {
            isProcessingResult = true; 
            clearInterval(countdownInterval); clearTimeout(quizTimerTimeout);
            
            const overlay = document.getElementById("bg-effect-overlay");
            const effectLayer = document.getElementById("quiz-effect-layer"); effectLayer.innerHTML = "";
            const mainDataWord = data.words.find(item => item.id === w.id);
            const now = Date.now();

            let canUpdateSRS = false;
            if (mainDataWord) {
                if (mainDataWord.status === 'new' || !mainDataWord.status || mainDataWord.status === 'miss') {
                    canUpdateSRS = true;
                }
                else if (mainDataWord.status === 'wait' && mainDataWord.nextReview && mainDataWord.nextReview <= now) {
                    canUpdateSRS = true;
                }
            }

            if(isCorrect) {
                overlay.className = "bg-correct-active"; setTimeout(() => { overlay.className = ""; }, 250);
                const box = document.createElement("div"); box.className = "quiz-effect-box";
                box.innerHTML = `<div class="quiz-effect-txt txt-correct">💮 CORRECT !!</div>`;
                effectLayer.appendChild(box);

                for(let i=0; i<12; i++){
                    const p = document.createElement("div"); p.className = "particle";
                    p.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
                    p.style.setProperty('--mx', `${(Math.random()-0.5)*180}px`); p.style.setProperty('--my', `${(Math.random()-0.5)*180}px`);
                    box.appendChild(p);
                }

                if(mainDataWord) {
                    mainDataWord.inRecentMissList = false;
                    if (quizMode === 'today' || quizMode === 'yesterday') {
                        mainDataWord.recentMissTimestamp = null;
                    }
                    if (canUpdateSRS) {
                        mainDataWord.lastTested = now;
                        if(mainDataWord.status === 'new' || !mainDataWord.status || mainDataWord.status === 'miss') {
                            mainDataWord.interval = 1; 
                            mainDataWord.status = 'wait';
                        } else { 
                            mainDataWord.interval = mainDataWord.interval * 2; 
                        }
                        mainDataWord.nextReview = now + (mainDataWord.interval * 24 * 60 * 60 * 1000); 
                    }
                }
            } else {
                overlay.className = "bg-miss-active"; setTimeout(() => { overlay.className = ""; }, 250);
                const box = document.createElement("div"); box.className = "quiz-effect-box";
                box.innerHTML = `<div class="quiz-effect-txt txt-miss">❌ MISS</div><div class="miss-ans-subtext">正解: ${quizMode === 'all_reverse' ? w.en : w.ja}</div>`;
                effectLayer.appendChild(box);

                if(mainDataWord) {
                    mainDataWord.lastTested = now;
                    mainDataWord.missCount = (mainDataWord.missCount || 0) + 1;
                    mainDataWord.recentMissTimestamp = now; 
                    mainDataWord.inRecentMissList = true;
                    mainDataWord.status = 'miss'; 
                    mainDataWord.interval = 0; 
                    mainDataWord.nextReview = null; 
                }
            }

            saveData();
            setTimeout(() => { 
                effectLayer.innerHTML = ""; 
                if (isProcessingResult) { 
                    currentQuizIndex++; 
                    nextQuestion(); 
                }
            }, isCorrect ? 900 : 1850);
        }

        // ==================== 背景アニメーション ====================
        const canvas = document.getElementById('highway-canvas'); const ctx = canvas?.getContext('2d');
        let backgroundLines = [];
        function resizeCanvas() { if(!canvas) return; canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function initLines() {
            backgroundLines = [];
            for (let i = 0; i < 15; i++) {
                backgroundLines.push({
                    x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
                    length: Math.random() * 50 + 30, speed: Math.random() * 2 + 1.5,
                    color: Math.random() > 0.5 ? '#ff0055' : '#00f0ff' 
                });
            }
        }
        function animateCity() {
            if(!ctx || !canvas) return; ctx.clearRect(0, 0, canvas.width, canvas.height);
            backgroundLines.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.length, l.y);
                ctx.strokeStyle = l.color; ctx.lineWidth = 1.0; ctx.stroke();
                l.x += l.speed; if (l.x > canvas.width) { l.x = -l.length; l.y = Math.random() * canvas.height; }
            });
            requestAnimationFrame(animateCity);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); initLines(); animateCity();

        // 起動
        loadData();
        updateUI();
        showPage('list'); // 調整しやすいように最初から一覧を表示
    </script>
</body>
</html>
